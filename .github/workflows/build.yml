name: Build VTUBE OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-os:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check source syntax
        run: |
          python3 -c "import ast, pathlib; [ast.parse(pathlib.Path(p).read_text(encoding='utf-8')) for p in ('app.py', 'vtube_avatar.py', 'vtube_live.py')]"
          bash -n tools/build-iso.sh
          python3 -m unittest discover -s tests -v

      - name: Install Debian Live build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools cpio wget debian-archive-keyring
          wget -O /tmp/live-build.deb https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          sudo apt-get install -y /tmp/live-build.deb
          lb --version

      - name: Build VTUBE OS live ISO
        run: sudo bash tools/build-iso.sh

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: VTUBE-OS-ISO
          path: |
            build-output/*.iso
            build-output/SHA256SUMS
          if-no-files-found: error
