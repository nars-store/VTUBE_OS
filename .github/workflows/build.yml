name: Build All - VTUBE OS and Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vtube-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-os:
    name: Build VTUBE OS ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Python syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path

          files = [
              "app.py",
              "vtube_avatar.py",
              "vtube_live.py",
          ]

          for name in files:
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f"File wajib tidak ditemukan: {name}")
              ast.parse(path.read_text(encoding="utf-8"), filename=name)
              print(f"OK: {name}")
          PY
          bash -n tools/build-iso.sh

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Install ISO build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            xorriso \
            squashfs-tools \
            cpio \
            wget \
            debian-archive-keyring

          wget -O /tmp/live-build.deb \
            https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb

          sudo apt-get install -y /tmp/live-build.deb
          lb --version

      - name: Build operating system
        run: sudo bash tools/build-iso.sh

      - name: Upload ISO and checksum
        uses: actions/upload-artifact@v4
        with:
          name: VTUBE-OS-ISO
          path: |
            build-output/*.iso
            build-output/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: Build VTUBE Connect APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platforms;android-35
            build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: vtube-connect/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VTUBE-Connect-APK
          path: vtube-connect/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
