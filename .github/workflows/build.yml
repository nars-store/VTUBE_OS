name: Build VTUBE OS ISO

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-os:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4


      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools cpio wget
          wget -O /tmp/live-build.deb \
            https://deb.debian.org/debian/pool/main/l/live-build/live-build_20250505+deb13u1_all.deb
          sudo apt-get install -y /tmp/live-build.deb
          lb --version

      - name: Build ISO
        run: |
          chmod +x tools/build-iso.sh
          sudo bash tools/build-iso.sh

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: vtube-os-iso
          path: |
            build-output/*.iso
            build-output/SHA256SUMS
